name = "brightsmile-dental"
type = "javascript"
account_id = "YOUR_ACCOUNT_ID_HERE"
workers_dev = true
compatibility_date = "2026-09-19"

# Configure this project as a Workers "site" so Wrangler will upload the static files
[site]
# The bucket is the folder containing your static files. Using the project root uploads all files.
bucket = "./"
# entry-point is used by Wrangler's build; keep default "workers-site" if needed.
entry-point = "workers-site"

# Replace `YOUR_ACCOUNT_ID_HERE` with your Cloudflare Account ID before publishing.
